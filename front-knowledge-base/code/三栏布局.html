<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
        margin: 0px;
        border: 0px;
        box-sizing: border-box;
    }
    body,html{
       height: 100%;

    }

    body{
        display:flex;
    }
    .center{
        flex-grow: 1;
        border: 1px black solid;
        order: 2;
    }
    .left{
        border:1px black solid;
        width: 200px;
        order: 1;

    }
 
    .right{
        border: 1px black solid;
        width: 200px;
        order: 3;
    }
  
  </style>
  <body>
    <div class="left">
        left
    </div>
    <div class="center">
        center
    </div>
    <div class="right">
        right
    </div>
  </body>
</html>
